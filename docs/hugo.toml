baseURL = 'https://docs.searchbase.md/'
locale = 'en-us'
theme = 'dockleaf'
title = 'Searchbase Documentation'

[params]
  description = 'Open-source, self-hostable, privacy-focused web search API for AI agents.'

  brand = 'Searchbase'
  logo = 'branding/searchbase-icon.png'
  favicon = 'branding/searchbase-icon.png'
  footer = '© 2026 coolapso. Searchbase is dual-licensed under AGPLv3 and a Commercial License.'

[outputs]
  home = ['HTML', 'JSON']

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    style = "onedark"
    lineNos = true

[[menus.main]]
  name = "Start"
  url = "/docs/getting-started/"
  weight = 1

[[menus.main]]
  name = "MCP"
  url = "/docs/mcp-integration/"
  weight = 2

[[menus.main]]
  name = "API"
  url = "/docs/api-reference/"
  weight = 3

[[menus.main]]
  name = "Development"
  url = "/development/"
  weight = 4

[[menus.main]]
  name = "GitHub"
  url = "https://github.com/coolapso/searchbase"
  weight = 5

