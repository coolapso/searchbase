# Development compose file.
# This intentionally starts all local services for development and manual testing.
# Do not treat this file as a production deployment template.

services:
  search-gateway:
    image: ghcr.io/coolapso/searchbase/search-gateway:latest
    build:
      context: ./search-gateway
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      - SEARCHBASE_PORT=8080
      - SEARCHBASE_CRAWL_WORKER_ADDRESS=http://crawl-worker:8000
      - SEARCHBASE_SEARCH_PROVIDER=ddgs
      - SEARCHBASE_DDGS_PROVIDER_ADDRESS=http://ddgs:8001
      # MCP heartbeat is off unless SEARCHBASE_MCP_HEARTBEAT_ENABLED is explicitly
      # set to true here. It keeps idle SSE and streamable HTTP connections alive
      # for clients that drop them after a shorter read timeout.
      # The interval is in seconds and must be >= 15 when the heartbeat is enabled.
      # - SEARCHBASE_MCP_HEARTBEAT_ENABLED=true
      # - SEARCHBASE_MCP_HEARTBEAT_INTERVAL=60
    depends_on:
      - crawl-worker

  crawl-worker:
    image: ghcr.io/coolapso/searchbase/crawl-worker:latest
    build:
      context: ./crawl-worker
      dockerfile: Containerfile
    ports:
      - "8000:8000"

  ddgs:
    image: ghcr.io/coolapso/searchbase/ddgs:latest
    build:
      context: ./ddgs
      dockerfile: Containerfile
    ports:
      - "8001:8001"

  searxng:
    image: docker.io/searxng/searxng:2026.5.17-d7e8b7cd1
    ports:
      - 8002:8080
    volumes:
      - searxng-data:/var/cache/searxng/
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml

configs:
  searxng_settings:
    content: |
      use_default_settings: true
      server:
        secret_key: "this-Is-a-Very-l33t-Secret-Key"
        limiter: false
        base_url: "http://localhost:8002"
      search:
        formats:
          - html
          - json

volumes:
  searxng-data:
